
spring.application.name=Backend

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/omnicanal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root123456!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ========================================
# JWT (JSON Web Token) - Bloque 1 Seguridad
# ========================================
# Clave Base64 de >= 256 bits para firmar los tokens con HS256.
# En producción muévela a una variable de entorno (NO subir a git).
app.jwt.secret=bXlTdXBlclNlY3JldEtleU9tbmljYW5hbFNhYVMyMDI2UGFyYUZpcm1hckpXVEhTMjU2QWxnb3JpdGht
# Expiración del token en milisegundos (86400000 = 24 horas)
app.jwt.expiration=86400000
