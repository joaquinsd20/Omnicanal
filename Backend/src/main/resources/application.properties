spring.application.name=Backend

# ========================================
# Base de datos (MySQL)
# Todos los valores sensibles salen de variables de entorno.
# Local: copia .env.example y exporta las variables, o usa los valores por defecto de abajo.
# ========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/omnicanal_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Esquema y datos demo idempotentes (schema.sql + data.sql)
# always = crea lo que falte al arrancar; never = no toca la BD
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Servidor (Render inyecta PORT)
server.port=${PORT:8080}
server.servlet.context-path=/api
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.hibernate.SQL=WARN

# ========================================
# Seguridad
# ========================================
# Clave Base64 de >= 256 bits para firmar JWT (HS256). Obligatoria: sin valor por defecto.
# Genera una con: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET}
# Expiración del token en ms (86400000 = 24 h)
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Orígenes permitidos para CORS, separados por coma (ej. https://omnicanal.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Límite de intentos de login por IP
app.security.login-max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login-window-minutes=${LOGIN_WINDOW_MINUTES:15}
